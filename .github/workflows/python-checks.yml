name: Python checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        discord-version: ['2.4.0', '2.7.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt "discord.py==${{ matrix.discord-version }}"
      - run: python -m compileall -q bot.py text_commands.py progression.py expansion.py start.py test_text_commands.py
      - run: python -m unittest test_text_commands
